name: Build Windows Desktop App (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows .exe (Portable & Installer)
        run: npm run electron:build

      - name: Upload Windows .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WorkTools-Windows-EXE
          path: |
            release/*.exe
          if-no-files-found: error
