name: Build Windows Desktop App (Rust / Tauri Portable .exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-rust:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stamp build version (1.0.<run_number>)
        shell: pwsh
        run: |
          $ver = "1.0.${{ github.run_number }}"
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$ver`"" | Set-Content src-tauri/Cargo.toml
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": ".*"', "`"version`": `"$ver`"" | Set-Content src-tauri/tauri.conf.json
          npm version $ver --no-git-tag-version --allow-same-version

      - name: Install frontend dependencies & build React dist
        run: |
          npm install
          npm run build

      - name: Build Rust Tauri Portable .exe
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --features custom-protocol

      - name: Prepare Portable .exe in release/
        shell: pwsh
        run: |
          $ver = "1.0.${{ github.run_number }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "src-tauri/target/release/worktools.exe" "release/WorkTools-$ver-Portable.exe"
          Get-ChildItem release/

      - name: Upload Windows Portable .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkTools-Windows-Rust-Portable-EXE
          path: |
            release/*Portable.exe
          if-no-files-found: error

      - name: Publish Portable .exe to GitHub Releases (for Auto-Update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WorkTools v1.0.${{ github.run_number }} (Rust Portable)
          body: "Ultra-lightweight Rust (Tauri v2) Windows Portable build from commit ${{ github.sha }}"
          files: |
            release/*Portable.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
