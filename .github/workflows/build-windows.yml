name: Build Windows Desktop App (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Stamp build version (1.0.<run_number>)
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Build Windows Portable .exe
        run: npm run electron:build

      - name: Upload Windows Portable .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkTools-Windows-EXE
          path: |
            release/*Portable.exe
          if-no-files-found: error

      - name: Publish Portable .exe to GitHub Releases (for Auto-Update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WorkTools v1.0.${{ github.run_number }} (Portable)
          body: "Automated Windows Portable build from commit ${{ github.sha }}"
          files: |
            release/*Portable.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
